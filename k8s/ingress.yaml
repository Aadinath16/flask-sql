apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-flask-sql
  annotations:
    kubernetes.io/ingress.class: "gce"          # ✅ Use GKE-managed ingress
    kubernetes.io/ingress.allow-http: "true"
    # ingress.gcp.kubernetes.io/healthcheck-path: /healthz  # ✅ Fix backend health checks
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: flask-service
            port:
              number: 80
