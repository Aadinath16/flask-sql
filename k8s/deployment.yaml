apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: default
  labels:
    app: flask

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: flask

  template:
    metadata:
      labels:
        app: flask

    spec:
      serviceAccountName: flask-ksa   # ✅ Workload Identity

      containers:

      # ============================
      # Flask App Container
      # ============================
      - name: flask
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: Always

        ports:
          - containerPort: 8080

        env:
          - name: DB_HOST
            value: "127.0.0.1"

          - name: DB_USER
            value: "test"

          - name: DB_NAME
            value: "flask_poc"

          - name: DB_PASS_FILE   # ✅ Correct env variable
            value: "/mnt/secrets/db-password"

          - name: VOLUME_PATH
            value: "/app/data"

        # ✅ Mount Secret Manager CSI
        volumeMounts:
          - name: secrets-store
            mountPath: "/mnt/secrets"
            readOnly: true

          - name: data-volume
            mountPath: "/app/data"

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20


      # ============================
      # Cloud SQL Proxy Sidecar
      # ============================
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.21.0

        args:
          - "--private-ip"
          - "--structured-logs"
          - "gcp-test-1618-dev:us-central1:gcp-test-1618-sql-dev"

        securityContext:
          runAsNonRoot: true

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

        # (Optional) Mount secrets here if needed later
        # volumeMounts:
        #   - name: secrets-store
        #     mountPath: "/mnt/secrets"
        #     readOnly: true


      # ============================
      # Volumes
      # ============================
      volumes:

        # ✅ Persistent Volume
        - name: data-volume
          persistentVolumeClaim:
            claimName: flask-pvc

        # ✅ Secret Manager CSI Volume
        - name: secrets-store
          csi:
            driver: secrets-store-gke.csi.k8s.io   # ✅ GKE driver
            readOnly: true
            volumeAttributes:
              secretProviderClass: "gcp-secrets"


